name: Build and Publish Docker image with Jib

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build on PRs (no push)
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon build

      - name: Compute image name and tags
        if: github.event_name != 'pull_request'
        id: meta
        shell: bash
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO_LOWER}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          TAGS=("sha-${GITHUB_SHA::7}")

          # main/master → добавляем latest
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/master" ]]; then
            TAGS+=("latest")
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS+=("$GITHUB_REF_NAME")
          fi

          (IFS=,; echo "tags=${TAGS[*]}") >> "$GITHUB_OUTPUT"

      - name: Build both images with Jib into the local Docker daemon
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew --no-daemon :bot:jibDockerBuild -Djib.to.image="localhost/jib-bot:latest"
          ./gradlew --no-daemon :ingest:jibDockerBuild -Djib.to.image="localhost/jib-web:latest"

      - name: Add HEALTHCHECK layer and push
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS:  ${{ steps.meta.outputs.tags }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
          IFS=',' read -ra TAG_LIST <<< "$TAGS"
          # The bot keeps the repository's image name; the web server is <image>-web.
          for pair in "bot:$IMAGE" "web:$IMAGE-web"; do
            src="${pair%%:*}"; dst="${pair#*:}"
            TAG_ARGS=()
            for tag in "${TAG_LIST[@]}"; do TAG_ARGS+=(-t "$dst:$tag"); done
            # Jib cannot emit a HEALTHCHECK instruction, so it is added on top of the Jib image.
            docker build --build-arg BASE_IMAGE=localhost/jib-$src:latest "${TAG_ARGS[@]}" - < Dockerfile
            for tag in "${TAG_LIST[@]}"; do docker push "$dst:$tag"; done
          done

      - name: Trigger Coolify deployments
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_DEPLOY_HOOK_URL: ${{ secrets.COOLIFY_DEPLOY_HOOK_URL }}
          COOLIFY_WEB_DEPLOY_HOOK_URL: ${{ secrets.COOLIFY_WEB_DEPLOY_HOOK_URL }}
          COOLIFY_DEPLOY_BEARER_TOKEN: ${{ secrets.COOLIFY_DEPLOY_BEARER_TOKEN }}
        shell: bash
        run: |
          AUTH_HEADER=()
          if [[ -n "$COOLIFY_DEPLOY_BEARER_TOKEN" ]]; then
            AUTH_HEADER=(-H "Authorization: Bearer $COOLIFY_DEPLOY_BEARER_TOKEN")
          fi
          failed=0
          for name in COOLIFY_DEPLOY_HOOK_URL COOLIFY_WEB_DEPLOY_HOOK_URL; do
            url="${!name}"
            if [[ -z "$url" ]]; then
              echo "$name is not set, skipping."
              continue
            fi
            http_code=$(curl -fsS -o /tmp/coolify_resp.txt -w "%{http_code}" -X POST "${AUTH_HEADER[@]}" "$url") || true
            echo "$name: HTTP $http_code"; cat /tmp/coolify_resp.txt || true; echo
            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then failed=1; fi
          done
          exit $failed
